name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  local-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
        with:
          version: v1.5.1
      - name: Install Python dependencies
        run: python -m pip install -r requirements.lock
      - name: Compile contracts
        run: forge build
      - name: Solidity tests
        run: forge test --offline
      - name: Python tests (mocks and loopback chains)
        run: python -m pytest -q tests
      - name: Publication boundary
        run: python tools/check_publication.py

  disclosure-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          audit_dir="$(mktemp -d)"
          cd "$audit_dir"
          base="https://github.com/gitleaks/gitleaks/releases/download/v8.30.1"
          curl -fsSLO "$base/gitleaks_8.30.1_linux_x64.tar.gz"
          curl -fsSLO "$base/gitleaks_8.30.1_checksums.txt"
          awk '$2 == "gitleaks_8.30.1_linux_x64.tar.gz" {print}' gitleaks_8.30.1_checksums.txt > selected.sha256
          test -s selected.sha256
          sha256sum --check selected.sha256
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          install -m 755 gitleaks /usr/local/bin/gitleaks
      - name: Scan source and complete history
        run: |
          gitleaks dir . --redact --no-banner
          gitleaks git . --redact --no-banner --log-opts="--all"
